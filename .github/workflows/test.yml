name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: gleam format --check src test demo/src
      - run: gleam test
      - run: cd demo && gleam build
