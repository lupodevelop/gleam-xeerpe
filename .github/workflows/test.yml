name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --prefix test/npm-xeerpe
      - run: gleam format --check src test dev
      - run: gleam test
      - run: scripts/build-site.sh
